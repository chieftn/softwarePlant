openapi: 3.0.3
info:
  title: Factory Plant API
  version: 1.0.0
  description: |
    Contract for plant and workbench REST operations implemented by the service.
    Live Entra/Cosmos wiring is deployment-specific. The HTML/Datastar application will call
    the same application operations and authorization rules, not duplicate them
    or call the bearer-only API through loopback HTTP.

    All operations require a validated Entra v2 access token from the configured
    tenant and for the configured API audience. Plant operations and workbench
    inventory require delegated human callers with Plant.Access and the
    Factory.User service-entry role. Workbench registration and presence require
    application tokens with Workbench.Connect and an active identity binding to
    the exact plant/workbench. Cookies are not API authentication and failures
    never redirect to login. Tenant/object IDs come from the validated token,
    never request fields.

    Plant creation additionally requires Factory.PlantCreator. Plant reads require
    current permission to read the plant; plant updates require current ownership.
    Service-wide enrollment inventory, submission, assignment and administrative retirement require
    delegated Factory.EnrollmentAdministrator in addition to Factory.User and Plant.Access.
    Device self-retirement requires Workbench.Connect and the exact provisioned
    tenant, client and service-principal binding; it grants no inventory or administrator access.
    Devices enroll unassigned. Assignment requires registration authority over both
    source and destination plants; unassigning retains enrollment and identity.
    Service entry alone grants no plant access. A resource-only grant does not
    confer plant-wide read or update authority. Lists and every subsequent page
    are filtered by current authorization.

    Mutations except short-lived enrollment challenges and version-conditional
    assignment require an Idempotency-Key UUID generated by the caller. Plant creation
    keys are scoped to the caller's tenant/object IDs and the create operation.
    Plant update keys are additionally scoped to the plant. Persist the outcome and a
    digest of the validated request, including the original If-Match for PUT.
    After rechecking current authorization, an identical retry returns the
    original status, body and headers without repeating the mutation. Reusing a
    key with different input returns 409. Check a recorded replay before testing
    If-Match for a new update. Replays describe the recorded outcome; GET reads
    current state.

    Workbench registration and presence keys are scoped to the authenticated
    daemon, plant, workbench and operation type. Identical retries return 204
    without another write or refreshing a server timestamp. A new report needs
    a new key. Daemons serialize reports of each type and resolve an outstanding
    report before issuing a newer one. Neither operation uses If-Match, admits
    a machine, changes permissions or modifies assignment/claim ownership.

    Versioned payloads require schemaVersion "1" (inside draft for enrollment wrappers) and reject unknown fields or
    unsupported versions. IDs are opaque and convey no authority. All timestamps
    are server-generated UTC values. Storage scope IDs and database ETags are not
    exposed as editable JSON properties.
servers:
  - url: /
    description: Same origin as the deployed API; no deployment address is selected.
security:
  - EntraBearer: []
tags:
  - name: Plants
    description: Plant identity, owner binding and editable plant properties.
  - name: Workbenches
    description: Scoped inventory and reports from an already activated daemon.
  - name: Enrollment
    description: Service-wide device enrollment, one-plant assignment and separate identity retirement.
  - name: ProductionLines
    description: Owned configuration definitions, immutable revisions and plant assignments inherited by workbenches.
paths:
  /v1/plants:
    get:
      operationId: listPlants
      tags: [Plants]
      summary: List plants the caller can read.
      description: |
        Return only authorized plants, ordered by ID ascending. The continuation
        token is opaque and bound to the caller and query. Recheck access on each
        page; pagination is not a snapshot of concurrent changes. An empty
        authorized result is 200 with an empty items array. Omit the token when
        there is no next page.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ContinuationToken'
      responses:
        '200':
          description: An authorized page of plants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    post:
      operationId: createPlant
      tags: [Plants]
      summary: Create a plant owned by the authenticated user.
      description: |
        Require Factory.PlantCreator as well as the delegated service-entry
        permissions. Generate the plant ID on the server. Commit the plant, its
        owner binding and audit event atomically. The owner is the validated
        caller's tenant/object ID pair. Clients cannot supply an owner, role
        assignments, lifecycle state, resource bindings or timestamps.

        Name uniqueness is not required: plant IDs, not names, identify plants.
        No Azure resources, directory objects or workbenches are provisioned by
        creating a plant.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantRequest'
      responses:
        '201':
          description: Plant and initial owner binding committed, or the identical creation replayed.
          headers:
            Location:
              description: Relative URI of the created plant under /v1/plants/{plantId}.
              required: true
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}:
    parameters:
      - $ref: '#/components/parameters/PlantId'
    get:
      operationId: getPlant
      tags: [Plants]
      summary: Read a plant's identity, owner and current properties.
      description: |
        Require current plant-read authority. Return a strong ETag for a
        subsequent conditional update. This response is not a resource listing
        and grants no access to sibling resources or unrelated plants.
      responses:
        '200':
          description: Current authorized plant representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    put:
      operationId: updatePlant
      tags: [Plants]
      summary: Replace the editable properties of an existing plant.
      description: |
        Require current plant ownership. The only editable property in this
        increment is name, which must be supplied. Preserve the plant ID, owner,
        lifecycle state, creation time, role assignments and resource bindings.
        Ownership transfer is a separate audited operation, not a PUT property.
        PUT never creates a missing plant.

        Require exactly one strong ETag obtained from GET or a prior successful
        mutation. Reject wildcard, weak or multiple tags with 400. A missing
        If-Match returns 428; a valid but stale tag returns 412 without a write.
        For a new operation, atomically check the revision and owner authority,
        update the name/revision/server timestamp and append an audit event.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: Exact strong ETag for the representation being replaced.
          schema:
            $ref: '#/components/schemas/EntityTag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantRequest'
      responses:
        '200':
          description: Updated plant, or the identical update replayed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}/workbenches:
    parameters:
      - $ref: '#/components/parameters/PlantId'
    get:
      operationId: listWorkbenches
      tags: [Workbenches]
      summary: List workbenches the caller can read within one plant.
      description: |
        Require delegated human service entry and current workbench-read
        authority at plant or individual resource scope. Filter every page to
        those workbenches; a resource-scoped grant never exposes siblings.
        A daemon token cannot enumerate this inventory.

        Order by workbench ID ascending. Bind continuation tokens to the caller,
        plant and query, and recheck current authorization on every page.
        Pagination is not a snapshot of concurrent changes. An empty authorized
        page is 200 with an empty items array. Omit the token at the end.
        Inventory begins when an approved identity binding has been recorded;
        pending enrollment requests are not workbench records.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ContinuationToken'
      responses:
        '200':
          description: An authorized page of workbenches in the requested plant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}/workbenches/{workbenchId}:
    parameters:
      - $ref: '#/components/parameters/PlantId'
      - $ref: '#/components/parameters/WorkbenchId'
    get:
      operationId: getWorkbench
      tags: [Workbenches]
      summary: Read one workbench's admission, metadata and presence.
      description: |
        Require delegated human service entry and current read authority for
        this exact resource. A resource-scoped reader need not have plant-wide
        read access. Resolve the workbench within the addressed plant; never
        search other plants or redirect to a matching ID elsewhere.

        Admission, reported readiness and observed contact are separate.
        Recent contact is not proof of execution readiness, and stale contact
        does not prove a worker stopped. This composite view has no If-Match
        revision and cannot be used to change registration or queue ownership.
      responses:
        '200':
          description: Authorized workbench state, assembled from its separate records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workbench'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkbenchNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}/workbenches/{workbenchId}/registration:
    parameters:
      - $ref: '#/components/parameters/PlantId'
      - $ref: '#/components/parameters/WorkbenchId'
    put:
      operationId: registerWorkbench
      tags: [Workbenches]
      summary: Replace observed metadata for an already active workbench.
      description: |
        Require an application token with Workbench.Connect. Validate its tenant,
        service-principal object ID and client ID against the current active
        binding for exactly this plant/workbench. Delegated users cannot call
        this operation, including owners and registrars. Missing, unapproved,
        revoked or differently bound identities are denied.

        Replace the reported metadata and record registeredAt using server time.
        After checking current admission, commit the metadata, idempotency outcome
        and audit event atomically in the workbench partition. An identical
        replay does not refresh registeredAt. Return 204 only after persistence.
        A new registration needs a new key; reports from the daemon are serialized.

        This does not create, enroll, activate, rename or rebind the admitted
        workbench, or alter certificates, grants, local policy or line bindings.
        Reported capabilities describe installed support, not permission to
        execute. Unsupported protocol/schema compatibility returns 409, not a
        guessed fallback. Registration does not update presence, claim work or
        start a worker.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchRegistration'
      responses:
        '204':
          description: Metadata committed, or the identical registration replayed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkbenchNotFound'
        '409':
          $ref: '#/components/responses/WorkbenchConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}/workbenches/{workbenchId}/presence:
    parameters:
      - $ref: '#/components/parameters/PlantId'
      - $ref: '#/components/parameters/WorkbenchId'
    put:
      operationId: reportWorkbenchPresence
      tags: [Workbenches]
      summary: Replace the daemon's current reported status and record contact.
      description: |
        Require an application Workbench.Connect token matching the current
        active identity binding for exactly this plant/workbench, as for
        registration. A human owner/registrar cannot impersonate the daemon.
        Registration must already have been accepted; otherwise return 409.

        Record lastSeenAt from server time when a new report is first committed.
        After checking current admission, commit the presence document and
        idempotency outcome atomically. Return 204 only after persistence.
        An identical replay returns 204 without advancing lastSeenAt or replacing
        a newer status. Reusing the key with a different payload returns 409.
        Use a new key for each new report and resolve an outstanding report
        before sending a newer one.

        The nominal interval is 30 seconds; contact older than 90 seconds is
        stale. Receipt proves contact, not execution readiness. This operation
        does not rewrite a whole-plant registry, registration metadata or an
        execution slot. It does not claim, release, heartbeat, cancel or complete
        an assignment. A reported idle status or a stale contact never releases
        ownership, even if a different record says execution remains active.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchPresence'
      responses:
        '204':
          description: Presence committed, or the identical report replayed without refreshing contact.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkbenchNotFound'
        '409':
          $ref: '#/components/responses/WorkbenchConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/challenge:
    post:
      operationId: challengeEnrollment
      tags: [Enrollment]
      summary: Obtain a short-lived challenge bound to this administrator and machine draft.
      description: |
        Require Factory.EnrollmentAdministrator. Plant authority alone is insufficient.
        Validate a public RSA certificate of at least 2048 bits, current and expiring
        within 200 days. Return a protected challenge expiring in five minutes.
        Sign the UTF-8 challenge bytes with the matching private key using
        RSA SHA-256 PKCS#1 v1.5. No directory objects are created by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft]
              properties:
                draft:
                  $ref: '#/components/schemas/EnrollmentDraft'
      responses:
        '200':
          description: A challenge bound to the exact draft and authenticated human.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, challenge, expiresAt]
                properties:
                  schemaVersion:
                    type: string
                    enum: ['1']
                  challenge:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/EnrollmentInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/EnrollmentUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments:
    get:
      operationId: listEnrollments
      tags: [Enrollment]
      summary: List service-wide device inventory, including unassigned and retired enrollments.
      description: |
        Require Factory.EnrollmentAdministrator. Return current assignment/version
        and latest Factory presence independently of plant membership. Order by ID
        ascending; continuation tokens bind the caller and query, not a snapshot.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ContinuationToken'
      responses:
        '200':
          description: A page of enrollment inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    post:
      operationId: submitEnrollment
      tags: [Enrollment]
      summary: Enroll this machine into Factory inventory without a plant assignment.
      description: |
        Verify the current challenge signature and Factory.EnrollmentAdministrator.
        Idempotency-Key must equal draft.operationId. Persist authorization,
        actor/time and the immutable draft before returning 202. A fresh challenge
        may retry the same draft; changing the draft under that key returns 409.
        The user submission authorizes enrollment, not a pending approval request.
        A background worker creates a dedicated certificate-backed Entra identity
        and grants only the configured API Workbench.Connect role. It checkpoints
        directory steps and reconciles ambiguous creates. Enrollment is independent
        of the operator's subsequent plant membership. No plant binding is created.
        Retry/resume the recorded operation rather than generating another identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft, challenge, signature]
              properties:
                draft:
                  $ref: '#/components/schemas/EnrollmentDraft'
                challenge:
                  type: string
                signature:
                  type: string
                  format: byte
      responses:
        '202':
          description: Durable operation accepted or the identical draft resumed; not proof of completed provisioning.
          headers:
            Location:
              description: Relative URL of this enrollment status operation.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/EnrollmentInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/EnrollmentUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    get:
      operationId: getEnrollment
      tags: [Enrollment]
      summary: Read the current device enrollment and assignment.
      description: |
        Require Factory.EnrollmentAdministrator, not necessarily the original
        enrolling principal. Provisioning continues after user logout. Ready means
        the directory identity exists; activation still requires
        the actual matching application token. needsAttention is not an invitation
        to submit another operation; an administrator must reconcile side effects.
      responses:
        '200':
          description: Current durable enrollment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No addressed enrollment exists. Code enrollment_not_found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/EnrollmentUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/activate:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: activateEnrollment
      tags: [Enrollment]
      summary: Activate only the exact provisioned application identity.
      description: |
        Require an application Workbench.Connect token matching the provisioned
        tenant, service-principal object ID and client ID. The body is empty and
        Idempotency-Key equals operationId. Commit active enrollment and its audit
        event atomically in the enrollment partition. Repeating activation is safe.
        No plant membership is required. Once active,
        runtime startup is independent of the enrolling user's session or continued
        plant access; current enrollment is still checked. This does not
        enable execution or replace later registration/presence reports.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Exact machine identity activated, or prior activation reconciled.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The pending machine binding is not ready. Code enrollment_not_ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/EnrollmentUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/assignment:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    put:
      operationId: assignEnrollment
      tags: [Enrollment]
      summary: Assign, move or unassign a provisioned device without changing its identity.
      description: |
        Require Factory.EnrollmentAdministrator and ownership/plant-scoped
        Workbench.Registrar authority over both source and destination plants.
        Only ready/active enrollments can be assigned. Omit plantId to unassign;
        explicit JSON null is invalid. expectedVersion replaces Idempotency-Key.
        A changed assignment increments its version atomically with an audit event.
        An identical completed expectedVersion+1/target retry is accepted; stale
        or conflicting changes return 409. Same-target requests at the current
        version do not increment it. Plant projection repair is resumable.
        Reports require the current assignment version and identity. Changing
        membership does not stop an offline process or cancel in-flight work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentAssignment'
      responses:
        '200':
          description: Current enrollment after assignment or safe replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/revoke:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: retireEnrollment
      tags: [Enrollment]
      summary: Revoke device access and durably request retirement of its dedicated identity.
      description: |
        Require Factory.EnrollmentAdministrator; Idempotency-Key equals operationId.
        Revoke access before asynchronous directory deletion, even for an offline
        device or an unexpired machine token. Preserve assignment/audit history.
        Reconcile in-flight or uncertain provisioning before deleting only owned,
        matching dedicated service-principal/application objects. Retry transient
        failures; retirementNeedsAttention requires operator reconciliation and an
        explicit retry of this endpoint. Retired is terminal.
        The optional original draft cancels an unsubmitted operation atomically,
        preventing delayed submission from resurrecting it. Without a draft an
        unknown operation returns 404; a mismatched existing draft returns 409.
        Repeats return current retirement status, not an immutable old response.
        Local software/certificate cleanup is separate. MSI 0.1.4 makes a bounded
        retirement attempt before full owned-local cleanup, even when retirement
        is unconfirmed; only an acknowledged transition proves revoked access.
        Disabling new enrollment does not disable retirement or existing connections.
        Missing provisioning configuration revokes access but requires attention.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentDraft'
      responses:
        '200':
          description: Retirement confirmed; local cleanup may proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '202':
          description: Access revoked; directory retirement is pending or requires attention and continues independently of device cleanup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown operation without its original draft.
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/retire-self:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: retireOwnEnrollment
      tags: [Enrollment]
      summary: Revoke only the authenticated device's own enrollment and request durable retirement.
      description: |
        Require an application token with Workbench.Connect and the exact
        provisioned tenant, application client ID and service-principal object ID.
        Accept ready/active identities and idempotent retirement retries. Require an
        empty body and Idempotency-Key equal to operationId; never accept caller-selected
        directory objects, permissions or drafts. No human, inventory or Graph grant
        is conferred. Unknown or differently bound enrollments return 403.
        Revoke access atomically before directory cleanup. Accepted cleanup survives
        device/key/journal removal. Offline or lost responses do not prove revocation.
        Missing device credentials or incomplete unbound enrollment require
        administrator retirement through inventory; they do not prevent local uninstall.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: This identity's retirement is confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '202':
          description: Access revoked; directory cleanup is pending or requires administrator attention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/connection:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    get:
      operationId: getWorkbenchAssignment
      tags: [Enrollment]
      summary: Read the authenticated device's current nullable plant assignment.
      security:
        - WorkbenchBearer: []
      responses:
        '200':
          description: Current assignment for the exact ready/active provisioned identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchAssignment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/presence:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    put:
      operationId: reportFactoryPresence
      tags: [Enrollment]
      summary: Report active device presence independently of plant assignment.
      description: |
        Require the exact active enrollment identity. Persist the report with a
        server timestamp and idempotency receipt in the enrollment partition,
        fencing concurrent retirement. Identical retries do not refresh contact.
        Assignment changes are discovered separately through connection; an
        unassigned device remains connected to Factory but has no plant access.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchPresence'
      responses:
        '204':
          description: Accepted or identical report replayed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/production-lines:
    get:
      operationId: listProductionLines
      tags: [ProductionLines]
      summary: List production lines owned by the authenticated Factory user.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ContinuationToken'
      responses:
        '200':
          description: Authorized page of current line definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLinePage'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    post:
      operationId: createProductionLine
      tags: [ProductionLines]
      summary: Define a line owned by the authenticated Factory user.
      description: |
        Requires delegated Plant.Access and Factory.User. Line identity, ownership
        and revisions are server-controlled. Configuration, immutable revision,
        idempotency receipt and audit are committed together. No repository,
        machine, credentials or tasks are provisioned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ProductionLineWrite'
      responses:
        '201':
          description: Created line or identical creation replay.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: Relative URI of the created production line.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLine'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/production-lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/ProductionLineId'
    get:
      operationId: getProductionLine
      tags: [ProductionLines]
      summary: Read an owned line's current definition and revision.
      responses:
        '200':
          $ref: '#/components/responses/ProductionLine'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    put:
      operationId: updateProductionLine
      tags: [ProductionLines]
      summary: Replace an owned line configuration using its current ETag.
      description: |
        Does not upsert. Requires current ownership, a strong If-Match and an
        Idempotency-Key. Identical retries return the recorded revision before
        checking If-Match. A new revision is archived immutably. Running work
        must not be rewritten by a configuration edit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/EntityTag'
      requestBody:
        $ref: '#/components/requestBodies/ProductionLineWrite'
      responses:
        '200':
          $ref: '#/components/responses/ProductionLine'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/plants/{plantId}/production-line:
    parameters:
      - $ref: '#/components/parameters/PlantId'
    get:
      operationId: getProductionLineBinding
      tags: [ProductionLines]
      summary: Read the plant's line assignment under plant read authority.
      responses:
        '200':
          $ref: '#/components/responses/ProductionLineBinding'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    put:
      operationId: assignProductionLine
      tags: [ProductionLines]
      summary: Assign or revoke one configured line for an active plant.
      description: |
        Requires ownership of the plant and, when assigning, the line. Uses
        expectedVersion, not an idempotency key. Omit productionLineId to revoke.
        The versioned binding is stored in the plant partition, independent of
        device enrollment. Active enrolled members inherit it, including devices
        assigned later. Removal or replacement revokes the old configuration for
        every member. Device moves revoke that device's old membership and
        configuration; the destination's current assignment is inherited under
        the new membership version. Acceptance does not confirm remote termination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLineAssignment'
      responses:
        '200':
          $ref: '#/components/responses/ProductionLineBinding'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/configuration:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    get:
      operationId: getWorkbenchLineConfiguration
      tags: [ProductionLines]
      summary: Exact active machine reads its authorized desired configuration.
      description: |
        Factory-level route remains available while unassigned. Returns null
        plant/line as appropriate, not an execution grant. Source workload
        retrieval and execution require separate, explicitly authorized operations.
      security:
        - WorkbenchBearer: []
      responses:
        '200':
          description: Current membership, binding and desired line revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchLineConfiguration'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/configuration-observation:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    put:
      operationId: observeWorkbenchConfiguration
      tags: [ProductionLines]
      summary: Exact active machine acknowledges its configuration observation.
      description: |
        Requires matching membership/binding/line revisions for a new report.
        Stale configuration returns 409. Identical retries do not overwrite a
        newer observation or refresh its timestamp. Available after plant
        unassignment through Factory authentication. This is not a mission claim
        or proof of worker containment. Graceful quiescing is not implemented.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchConfigurationObservation'
      responses:
        '204':
          description: Observation persisted or identical report replayed.
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/workload:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: resolveWorkbenchWorkload
      tags: [ProductionLines]
      summary: Resolve bounded repository specs at one immutable source commit.
      description: |
        Requires exact active machine authority and matching membership, binding,
        line ID and revision before and after resolution. GitHub App credentials
        are service-owned and are never returned with the specs. No execution grant.
      security:
        - WorkbenchBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadRequest'
      responses:
        '200':
          description: Pinned and validated workload snapshot; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedRepositoryWorkload'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: claimDevelopmentMission
      tags: [ProductionLines]
      summary: Reserve one eligible issue and freeze its owned mission.
      description: |
        Disabled by default. Requires current machine/configuration authority,
        explicit issue number, labels, acceptance criteria, verification commands,
        publication policy and trusted reviewers. Idempotency-Key must equal the
        request operationId. Repository-wide issue ownership is unique; uncertain
        reservations are retained rather than automatically requeued.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentClaimRequest'
      responses:
        '200':
          $ref: '#/components/responses/DevelopmentMissionDelivery'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
    get:
      operationId: getDevelopmentMission
      tags: [ProductionLines]
      summary: Read the exact machine's retained mission under current authority.
      security:
        - WorkbenchBearer: []
      responses:
        '200':
          $ref: '#/components/responses/DevelopmentMissionDelivery'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/authorize:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: authorizeDevelopmentMission
      tags: [ProductionLines]
      summary: Recheck current ownership, policy, repository authority and frozen issue.
      security:
        - WorkbenchBearer: []
      responses:
        '204':
          description: Current owned mission remains authorized; not a permanent grant.
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/credential:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: getDevelopmentSourceCredential
      tags: [ProductionLines]
      summary: Obtain a short-lived repository-scoped source credential.
      description: |
        No ambient personal credential fallback. Publish purpose requires recorded
        exact candidate publication intent and separately enabled connection writes.
        Repository tokens cannot themselves restrict a branch. Never log the token.
      security:
        - WorkbenchBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCredentialRequest'
      responses:
        '200':
          description: Sensitive child-only source credential; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryAccessCredential'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/publish:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: publishDevelopmentPullRequest
      tags: [ProductionLines]
      summary: Create or read back the one marker-bound draft PR for recorded intent.
      description: Worker pushes the exact candidate separately. This operation never merges.
      security:
        - WorkbenchBearer: []
      requestBody:
        $ref: '#/components/requestBodies/MissionCandidate'
      responses:
        '200':
          $ref: '#/components/responses/DevelopmentPublication'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/published:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: reconcileDevelopmentPublication
      tags: [ProductionLines]
      summary: Read back recorded publication without replaying agent work or creating a PR.
      security:
        - WorkbenchBearer: []
      requestBody:
        $ref: '#/components/requestBodies/MissionCandidate'
      responses:
        '200':
          description: Exact owned publication receipt, or JSON null when no matching PR exists.
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/PublishedDevelopmentPullRequest'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/review:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    get:
      operationId: getDevelopmentReview
      tags: [ProductionLines]
      summary: Read bounded commit-specific reviews and revision comments.
      description: |
        Formal trusted current-head approval is authoritative. General revision
        comments require /factory revise followed by the exact 40-character head.
        An untrusted comment cannot start work or widen mission authority.
      security:
        - WorkbenchBearer: []
      responses:
        '200':
          description: Current PR state/head and bounded review feedback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentReview'
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/progress:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    put:
      operationId: reportDevelopmentMission
      tags: [ProductionLines]
      summary: Persist idempotent progress without decreasing frozen mission counters.
      description: |
        Identical retries cannot overwrite newer state. Approved progress is
        independently checked against trusted current-head GitHub reviews.
        The exact original machine can report faults after binding revocation;
        fault reporting does not grant execution or release ownership.
        Omit absent nullable request fields; explicit top-level nulls are rejected.
      security:
        - WorkbenchBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentMissionProgress'
      responses:
        '204':
          description: Progress persisted or identical receipt replayed.
        default:
          $ref: '#/components/responses/UnexpectedFailure'
  /v1/enrollments/{operationId}/mission/terminated:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      operationId: confirmDevelopmentTermination
      tags: [ProductionLines]
      summary: Original enrolled machine records confirmed owned-worker termination.
      description: |
        Available after retirement or unassignment using the exact retained
        machine identity. Does not restore authority, delete evidence, release
        repository-wide issue ownership, or prove sandbox containment.
      security:
        - WorkbenchBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionTerminationRequest'
      responses:
        '204':
          description: Termination confirmation durably recorded.
        default:
          $ref: '#/components/responses/UnexpectedFailure'
components:
  securitySchemes:
    EntraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Entra v2 API access token validated for the configured tenant issuer,
        audience, signature and lifetime. Require delegated Plant.Access and
        Factory.User; create additionally requires Factory.PlantCreator;
        global enrollment administration requires Factory.EnrollmentAdministrator.
        Plant authority is checked from current owner/scoped records, not a
        tenant-wide Plant.Owner claim. Cookies and caller-supplied identity
        headers are not accepted. No tenant or client ID is selected by this contract.
    WorkbenchBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Entra v2 application token for the configured API with Workbench.Connect.
        Validate issuer, audience, signature and lifetime, then require the
        tenant/service-principal object ID and client ID to match the current
        active enrollment and, for plant reports, the current exact plant assignment
        and version. A valid role alone is
        insufficient. Recheck admission before every mutation and replay;
        admission revocation denies subsequent calls even with an unexpired
        token. An already-authorized in-flight operation may complete before
        revocation commits. Activation separately accepts only its exact provisioned
        pending identity before the first active transition. Delegated user tokens are not accepted.
  parameters:
    ProductionLineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: operationId
      in: path
      required: true
      description: UUID persisted by the installer before its first submission; reuse it on resume.
      schema:
        type: string
        format: uuid
    PlantId:
      name: plantId
      in: path
      required: true
      description: Opaque plant ID assigned at creation.
      schema:
        $ref: '#/components/schemas/PlantId'
    WorkbenchId:
      name: workbenchId
      in: path
      required: true
      description: Opaque device workbench ID; enrollment remains stable across plant moves.
      schema:
        $ref: '#/components/schemas/WorkbenchId'
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of items to return in this page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    ContinuationToken:
      name: continuationToken
      in: query
      description: Token returned by the preceding page. Invalid tokens return 400.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated UUID for one mutation. Keep the same key and input when
        retrying transport failures. A different intended mutation needs a new key.
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Opaque strong revision tag, including its surrounding quotes.
      required: true
      schema:
        $ref: '#/components/schemas/EntityTag'
    RetryAfter:
      description: Minimum delay in whole seconds before a transport retry.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
  requestBodies:
    MissionCandidate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissionCandidateRequest'
    ProductionLineWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductionLineWriteRequest'
  schemas:
    ProductionLineWriteRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, source, tasks, policy]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        name:
          $ref: '#/components/schemas/PlantName'
        source:
          $ref: '#/components/schemas/ProductionLineSource'
        tasks:
          $ref: '#/components/schemas/ProductionLineTasks'
        policy:
          $ref: '#/components/schemas/ProductionLinePolicy'
    ProductionLineSource:
      type: object
      additionalProperties: false
      required: [provider, repository, baseBranch, workloadPath, connectionReference]
      properties:
        provider:
          type: string
          enum: [github]
        repository:
          type: string
          minLength: 3
          maxLength: 200
          description: GitHub owner/name, never a URL or credential.
        baseBranch:
          type: string
          minLength: 1
          maxLength: 128
          description: Valid Git branch name; resolved and pinned before future execution.
        workloadPath:
          type: string
          minLength: 1
          maxLength: 256
          description: Relative repository folder with no empty, dot or traversal segments.
        connectionReference:
          $ref: '#/components/schemas/ConnectionReference'
    ProductionLineTasks:
      type: object
      additionalProperties: false
      required: [provider, repository, connectionReference, requiredLabels]
      properties:
        provider:
          type: string
          enum: [github-issues]
        repository:
          type: string
          minLength: 3
          maxLength: 200
          description: Independently selected issue repository in owner/name form.
        connectionReference:
          $ref: '#/components/schemas/ConnectionReference'
        requiredLabels:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Required approval/selection labels; duplicates are rejected case-insensitively.
          items:
            type: string
            minLength: 1
            maxLength: 64
    ConnectionReference:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-zA-Z0-9_.-]+$'
      description: |
        Logical service connection identifier, not credentials. Managed
        github-{32 lowercase hex} references are created through the browser's
        repository-connections onboarding, must belong to the line owner and
        must be connected with this repository selected. Legacy service-configured
        references remain supported. Disabling a managed connection denies new
        workload/mission authority; existing external tokens can outlive that change.
    ProductionLinePolicy:
      type: object
      additionalProperties: false
      required: [allowShellExecution, allowPublication, maximumIterations, timeoutMinutes]
      description: Publication requires shell approval; local permissions remain an independent upper bound.
      properties:
        allowShellExecution:
          type: boolean
        allowPublication:
          type: boolean
        maximumIterations:
          type: integer
          minimum: 1
          maximum: 20
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 240
    ProductionLine:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, revision, owner, createdAt, updatedAt, definition]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/EntityTag'
        owner:
          $ref: '#/components/schemas/EntraUser'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        definition:
          $ref: '#/components/schemas/ProductionLineWriteRequest'
    ProductionLinePage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductionLine'
        continuationToken:
          type: string
    ProductionLineAssignment:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775806
        productionLineId:
          type: string
          format: uuid
          description: Omit to revoke. Explicit null is invalid.
    ProductionLineBinding:
      type: object
      additionalProperties: false
      required: [schemaVersion, plantId, version, productionLineId]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        plantId:
          $ref: '#/components/schemas/PlantId'
        version:
          type: integer
          format: int64
          minimum: 0
        productionLineId:
          type: string
          format: uuid
          nullable: true
    WorkbenchLineConfiguration:
      type: object
      additionalProperties: false
      required: [schemaVersion, enrollmentId, workbenchId, plantId, assignmentVersion, bindingVersion, productionLine]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        enrollmentId:
          type: string
          format: uuid
        workbenchId:
          $ref: '#/components/schemas/WorkbenchId'
        plantId:
          type: string
          format: uuid
          nullable: true
        assignmentVersion:
          type: integer
          format: int64
          minimum: 0
        bindingVersion:
          type: integer
          format: int64
          minimum: 0
          description: Current plant's production-line assignment version; zero while unassigned from a plant.
        productionLine:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProductionLine'
    WorkbenchConfigurationObservation:
      type: object
      additionalProperties: false
      required: [schemaVersion, assignmentVersion, bindingVersion, state, reason]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        assignmentVersion:
          type: integer
          format: int64
          minimum: 0
        bindingVersion:
          type: integer
          format: int64
          minimum: 0
        productionLineId:
          type: string
          format: uuid
        productionLineRevision:
          $ref: '#/components/schemas/EntityTag'
        state:
          type: string
          enum: [unconfigured, preparing, blocked, stopping, needsAttention]
        reason:
          type: string
          minLength: 1
          maxLength: 256
    WorkloadRequest:
      type: object
      additionalProperties: false
      required: [assignmentVersion, bindingVersion, productionLineId, productionLineRevision]
      properties:
        assignmentVersion:
          type: integer
          format: int64
          minimum: 0
        bindingVersion:
          type: integer
          format: int64
          minimum: 0
        productionLineId:
          type: string
          format: uuid
        productionLineRevision:
          $ref: '#/components/schemas/EntityTag'
    GitCommit:
      type: string
      pattern: '^[A-Fa-f0-9]{40}$'
    SnapshotDigest:
      type: string
      pattern: '^[A-F0-9]{64}$'
    ResolvedRepositoryWorkload:
      type: object
      additionalProperties: false
      required: [schemaVersion, configuration, sourceCommit, digest, files]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        configuration:
          $ref: '#/components/schemas/WorkbenchLineConfiguration'
        sourceCommit:
          $ref: '#/components/schemas/GitCommit'
        digest:
          $ref: '#/components/schemas/SnapshotDigest'
        files:
          type: object
          minProperties: 4
          maxProperties: 4
          description: Relative workload paths mapped to UTF-8 contents, each at most 16 KiB; total snapshot at most 96 KiB.
          additionalProperties:
            type: string
            minLength: 1
    DevelopmentClaimRequest:
      type: object
      additionalProperties: false
      required: [operationId, configuration, workloadDigest, issueNumber, model]
      properties:
        operationId:
          type: string
          format: uuid
        configuration:
          $ref: '#/components/schemas/WorkloadRequest'
        workloadDigest:
          $ref: '#/components/schemas/SnapshotDigest'
        issueNumber:
          type: integer
          format: int64
          minimum: 1
        model:
          type: string
          minLength: 1
          maxLength: 128
    DevelopmentIssue:
      type: object
      additionalProperties: false
      required: [number, repository, title, body, acceptanceCriteria, labels, updatedAt]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
        repository:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          minLength: 1
          maxLength: 16384
        acceptanceCriteria:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 1024
        labels:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    DevelopmentMission:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, workload, issue, model, createdAt, approvalDeadline, digest, branch]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        id:
          type: string
          format: uuid
        workload:
          $ref: '#/components/schemas/ResolvedRepositoryWorkload'
        issue:
          $ref: '#/components/schemas/DevelopmentIssue'
        model:
          type: string
          minLength: 1
          maxLength: 128
        createdAt:
          type: string
          format: date-time
        approvalDeadline:
          type: string
          format: date-time
          description: Fixed human deadline, no later than seven days after createdAt.
        digest:
          $ref: '#/components/schemas/SnapshotDigest'
        branch:
          type: string
          readOnly: true
          description: factory/mission-{id}
    DevelopmentMissionDelivery:
      type: object
      additionalProperties: false
      required: [mission, state, reviewers, publicationPending]
      properties:
        mission:
          $ref: '#/components/schemas/DevelopmentMission'
        state:
          type: string
          enum: [reserving, rejected, claimed, executing, publishing, awaitingApproval, revising, approved, blocked, cancelled, needsAttention]
        reviewers:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
        publicationPending:
          type: boolean
          description: Recorded write intent permits read-back reconciliation, not agent replay.
    MissionCandidateRequest:
      type: object
      additionalProperties: false
      required: [candidateCommit]
      properties:
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
    MissionCredentialRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [read, publish]
    RepositoryAccessCredential:
      type: object
      additionalProperties: false
      required: [repository, token, expiresAt]
      properties:
        repository:
          type: string
        token:
          type: string
          description: Sensitive installation token; not a Copilot model credential.
        expiresAt:
          type: string
          format: date-time
    PublishedDevelopmentPullRequest:
      type: object
      additionalProperties: false
      required: [number, repository, branch, baseBranch, candidateCommit, url]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
        repository:
          type: string
        branch:
          type: string
        baseBranch:
          type: string
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
        url:
          type: string
          format: uri
    DevelopmentReviewFeedback:
      type: object
      additionalProperties: false
      required: [id, actor, candidateCommit, kind, body, recordedAt]
      properties:
        id:
          type: string
        actor:
          type: string
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
        kind:
          type: string
          enum: [approved, changesRequested, dismissed, comment]
        body:
          type: string
        recordedAt:
          type: string
          format: date-time
    DevelopmentReview:
      type: object
      additionalProperties: false
      required: [candidateCommit, state, feedback]
      properties:
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
        state:
          type: string
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/DevelopmentReviewFeedback'
    DevelopmentMissionProgress:
      type: object
      additionalProperties: false
      required: [missionId, missionDigest, state, iterations, activeMilliseconds, publicationPending, reason]
      properties:
        missionId:
          type: string
          format: uuid
        missionDigest:
          $ref: '#/components/schemas/SnapshotDigest'
        state:
          type: string
          enum: [claimed, executing, publishing, awaitingApproval, revising, approved, blocked, cancelled, needsAttention]
        iterations:
          type: integer
          minimum: 0
          maximum: 20
        activeMilliseconds:
          type: integer
          format: int64
          minimum: 0
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
        pullRequest:
          $ref: '#/components/schemas/PublishedDevelopmentPullRequest'
        publicationPending:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 256
    MissionTerminationRequest:
      type: object
      additionalProperties: false
      required: [missionId, confirmed]
      properties:
        missionId:
          type: string
          format: uuid
        confirmed:
          type: boolean
          enum: [true]
    EnrollmentDraft:
      type: object
      additionalProperties: false
      required: [schemaVersion, operationId, installationId, machineName, publicCertificate]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        operationId:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
        machineName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
        publicCertificate:
          type: string
          format: byte
          maxLength: 16384
          description: Base64 DER X.509 public certificate only. Never a PFX, private key or token.
    Enrollment:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, plantId, workbenchId, state, updatedAt, assignmentVersion]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
          nullable: true
          description: Current assignment, explicitly null when unassigned. Not an enrollment scope.
        workbenchId:
          $ref: '#/components/schemas/WorkbenchId'
        state:
          type: string
          enum: [authorized, provisioning, ready, active, failed, needsAttention, revoking, retirementNeedsAttention, retired]
        updatedAt:
          type: string
          format: date-time
        clientId:
          type: string
          format: uuid
        servicePrincipalId:
          type: string
          format: uuid
        error:
          type: string
          description: Safe provisioning/reconciliation guidance, never Graph response bodies or credentials.
        machineName:
          type: string
        assignmentVersion:
          type: integer
          format: int64
          minimum: 0
        presence:
          $ref: '#/components/schemas/WorkbenchPresence'
        lastSeenAt:
          type: string
          format: date-time
          description: Last accepted Factory presence, independent of plant membership.
    EnrollmentPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Enrollment'
        continuationToken:
          type: string
    EnrollmentAssignment:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775806
        plantId:
          type: string
          format: uuid
          description: Destination plant; omit to unassign. Explicit null is invalid.
    WorkbenchAssignment:
      type: object
      additionalProperties: false
      required: [schemaVersion, enrollmentId, workbenchId, plantId, version]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        enrollmentId:
          type: string
          format: uuid
        workbenchId:
          $ref: '#/components/schemas/WorkbenchId'
        plantId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
    PlantId:
      type: string
      format: uuid
    PlantName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '\S'
      description: Display name containing at least one non-whitespace character. Not an identity key.
    EntityTag:
      type: string
      minLength: 3
      pattern: '^"[^"]+"$'
      description: A single opaque strong ETag. Wildcards, weak tags and tag lists are invalid.
    EntraUser:
      type: object
      additionalProperties: false
      required: [tenantId, objectId]
      properties:
        tenantId:
          type: string
          format: uuid
        objectId:
          type: string
          format: uuid
      description: An Entra user identified by tenant and object IDs, not a display name or email address.
    CreatePlantRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        name:
          $ref: '#/components/schemas/PlantName'
    UpdatePlantRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        name:
          $ref: '#/components/schemas/PlantName'
    Plant:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, name, owner, state, createdAt, updatedAt]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        id:
          $ref: '#/components/schemas/PlantId'
        name:
          $ref: '#/components/schemas/PlantName'
        owner:
          $ref: '#/components/schemas/EntraUser'
        state:
          type: string
          enum: [active]
          description: Only active plants are defined in this increment; lifecycle transitions are out of scope.
        createdAt:
          type: string
          format: date-time
          description: Server-generated UTC creation time.
        updatedAt:
          type: string
          format: date-time
          description: Server-generated UTC time of the most recent committed update.
    PlantPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Plant'
        continuationToken:
          type: string
          minLength: 1
          description: Present only when another page is available; pass it unchanged.
    WorkbenchId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: Opaque server-assigned identifier; not a machine name or permission grant.
    EntraApplicationPrincipal:
      type: object
      additionalProperties: false
      required: [tenantId, objectId, clientId]
      properties:
        tenantId:
          type: string
          format: uuid
        objectId:
          type: string
          format: uuid
          description: Service-principal object ID; not the application object ID or client ID.
        clientId:
          type: string
          format: uuid
          description: Application client ID, stored separately from its service-principal object ID.
      description: Public identity binding recorded by enrollment, never submitted through registration.
    WorkbenchRegistration:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - machineName
        - hostVersion
        - workerVersion
        - protocolVersion
        - assignmentSchemaVersions
        - capabilities
      properties:
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: Required for enrollment-backed plant reports; must match the current assignment.
        schemaVersion:
          type: string
          enum: ['1']
        machineName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Observed machine metadata, not the approved workbench name or identity.
        hostVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Installed Windows host version.
        workerVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Installed Linux/WSL worker version.
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '\S'
          description: Installed protocol version; not inferred from this JSON envelope's schema version.
        assignmentSchemaVersions:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '\S'
          description: Assignment snapshot versions the installed worker can validate and execute.
        capabilities:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '\S'
          description: |
            Distinct installed capability identifiers, compared case-sensitively.
            Advertising support never grants execution permission or authorizes
            downloading an implementation. No credentials, source, paths or
            arbitrary integration destinations belong here.
    WorkbenchPresence:
      type: object
      additionalProperties: false
      required: [schemaVersion, status]
      properties:
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: Required for enrollment-backed plant reports; omit for Factory-level presence.
        schemaVersion:
          type: string
          enum: ['1']
        status:
          type: string
          enum: [idle, busy, notReady]
          description: |
            Daemon-reported availability, not authoritative queue/claim state.
            Idle means locally ready for work, busy means locally occupied, and
            notReady means local prerequisites or policy currently block work.
            The service must still enforce admission, grants and slot ownership.
        reason:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '\S'
          description: Optional safe explanation; no source, command output, credentials or private paths.
    Workbench:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, plantId, name, identity, admissionState, contactState, createdAt]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        id:
          $ref: '#/components/schemas/WorkbenchId'
        plantId:
          $ref: '#/components/schemas/PlantId'
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Approved workbench display name, assigned by enrollment; not changed by registration.
        identity:
          $ref: '#/components/schemas/EntraApplicationPrincipal'
        admissionState:
          type: string
          enum: [pending, active, unassigned, revoked]
          description: |
            Server-controlled admission. Pending awaits proof of the daemon
            identity; only active bindings may report registration/presence.
            Other enrollment progress remains on the enrollment operation.
        contactState:
          type: string
          enum: [unknown, online, stale]
          description: |
            Computed at read time. Unknown means no accepted presence report.
            Online means the latest new report is at most 90 seconds old;
            otherwise stale. Independent of admission and reported readiness.
            Never releases a claim or proves a process stopped.
        createdAt:
          type: string
          format: date-time
          description: Server-generated UTC time when the approved identity binding was recorded.
        registration:
          $ref: '#/components/schemas/WorkbenchRegistration'
        registeredAt:
          type: string
          format: date-time
          description: |
            Server-generated UTC time of the most recent new registration.
            Present exactly when registration is present; retries do not refresh it.
        presence:
          $ref: '#/components/schemas/WorkbenchPresence'
        lastSeenAt:
          type: string
          format: date-time
          description: |
            Server-generated UTC time of the most recent new presence report.
            Present exactly when presence is present; retries do not refresh it.
            Omitted, not fabricated, before the first presence report.
        enrollmentId:
          type: string
          format: uuid
        enrollmentState:
          type: string
          description: Current backing enrollment state, when present.
        enrollmentError:
          type: string
          description: Safe retirement or provisioning guidance, when present.
        configurationObservation:
          $ref: '#/components/schemas/WorkbenchConfigurationObservation'
        configurationObservedAt:
          type: string
          format: date-time
    WorkbenchPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion:
          type: string
          enum: ['1']
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Workbench'
        continuationToken:
          type: string
          minLength: 1
          description: Present only when another page is available; pass it unchanged.
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI, or about:blank when no dedicated type is defined.
        title:
          type: string
          description: Safe, human-readable summary.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: Matches the HTTP response status.
        detail:
          type: string
          description: Safe explanation; never credentials, source or internal exception details.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
        correlationId:
          type: string
          minLength: 1
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 1
          description: When present, matches the Retry-After header.
  responses:
    DevelopmentMissionDelivery:
      description: Frozen owned mission and current durable state; Cache-Control no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DevelopmentMissionDelivery'
    DevelopmentPublication:
      description: Exact marker-bound owned draft PR receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishedDevelopmentPullRequest'
    ProductionLine:
      description: Current or recorded production-line definition.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductionLine'
    ProductionLineBinding:
      description: Effective versioned line binding; null line means unassigned or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductionLineBinding'
    EnrollmentInvalid:
      description: Invalid draft, certificate, expired/substituted challenge, or signature. Code invalid_request, invalid_machine_certificate, or invalid_enrollment_proof.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    EnrollmentUnavailable:
      description: Enrollment is disabled or persistence is unavailable. Code enrollment_disabled or service_unavailable. No seeded identity or interactive-credential fallback.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RequestTooLarge:
      description: Request body exceeds 128 KiB. Code request_too_large.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InvalidRequest:
      description: |
        Malformed input, missing required input (except If-Match), unknown field,
        unsupported schema version or invalid pagination/ETag. Code invalid_request.
        Fix the request; do not retry unchanged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthenticated:
      description: Missing or invalid bearer authentication. Code unauthenticated. No HTML redirect.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
          description: Bearer authentication challenge without sensitive token details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: |
        Authenticated caller lacks required service-entry or current scoped
        authority. Code forbidden. Knowing the plant ID grants no access.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: No plant exists at this ID. Code plant_not_found. PUT does not upsert.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    WorkbenchNotFound:
      description: |
        No plant or workbench exists in the addressed scope. Code plant_not_found
        or workbench_not_found. Never resolve a workbench through another plant
        or create it implicitly through registration/presence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    WorkbenchConflict:
      description: |
        Code idempotency_conflict for key reuse with different input,
        incompatible_version for unsupported protocol/schema compatibility, or
        workbench_not_registered for presence before registration. No write.
        Wrong or inactive daemon bindings are authorization failures (403),
        not a reason to provision a new identity. Do not retry every conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: |
        A genuine operation/state conflict. Code idempotency_conflict for reuse
        with different input, or plant_state_conflict for an incompatible current
        state. Do not retry every conflict automatically.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: ETag is stale. Code etag_mismatch. Read current state before deciding on a new update.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Request body is not application/json. Code unsupported_media_type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionRequired:
      description: Required If-Match header is absent. Code precondition_required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Request rate exceeded. Code rate_limited. Retry only after the indicated delay.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unavailable:
      description: |
        Transient dependency failure or bounded contention. Code
        service_unavailable. Retry after the indicated delay, preserving mutation
        input, Idempotency-Key and If-Match.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnexpectedFailure:
      description: Unexpected server failure. Code internal_error. Preserve mutation keys if retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
